stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

# Cache node_modules across jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .next/cache/

# ── Build ──────────────────────────────────────────────────────

build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - .next/
      - .vercel/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Deploy to Production (main branch) ────────────────────────

deploy_production:
  stage: deploy
  image: node:${NODE_VERSION}
  needs: [build]
  script:
    - npm i -g vercel
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  environment:
    name: production
    url: https://docs.horusrobotics.dev
  variables:
    VERCEL_ORG_ID: $VERCEL_ORG_ID
    VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Deploy Preview (merge requests) ───────────────────────────

deploy_preview:
  stage: deploy
  image: node:${NODE_VERSION}
  needs: [build]
  script:
    - npm i -g vercel
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - PREVIEW_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
    - echo "Preview deployed to $PREVIEW_URL"
  environment:
    name: preview/$CI_MERGE_REQUEST_IID
    url: $PREVIEW_URL
    on_stop: stop_preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stop_preview:
  stage: deploy
  image: node:${NODE_VERSION}
  script:
    - echo "Preview environment cleaned up"
  environment:
    name: preview/$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
