name: translate-docs

# Docs translation pipeline (manual for now). Translates a batch of English docs pages into a target
# locale with DeepSeek and opens a PR for review. Output lands in content/i18n/{locale}/ — a separate
# tree that the docs-app i18n ROUTING (the next structural step) will serve at /{locale}/... .
#
# Manual (workflow_dispatch) on purpose: the translated pages are inert until routing is wired, so you
# run this deliberately and in batches (--limit) rather than accumulating unreviewed inert content.
# Once routing exists, switch to a `schedule:` for continuous incremental translation.
#
# SETUP: repo secret DEEPSEEK_API_KEY. (~$0.01/page on DeepSeek V4 Flash; 122 small pages ≈ ~$1.)

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Target locale: zh | ja | de'
        required: true
        default: 'zh'
      limit:
        description: 'Max pages to translate this run'
        required: false
        default: '20'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Translate a batch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/translate-docs.mjs --locale "${{ github.event.inputs.locale }}" --limit "${{ github.event.inputs.limit }}"
      - name: Open PR for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: i18n/docs-${{ github.event.inputs.locale }}
          delete-branch: true
          title: 'i18n(docs): ${{ github.event.inputs.locale }} translation batch (review)'
          commit-message: 'i18n(docs): DeepSeek translation batch (${{ github.event.inputs.locale }})'
          body: |
            Machine-translated docs batch → `content/i18n/${{ github.event.inputs.locale }}/`.
            **Review before merge**: code/JSX/frontmatter keys should be verbatim; only prose translated.
            (Large pages >14k chars are skipped — they need section chunking, a follow-up.)
          labels: i18n, needs-review
