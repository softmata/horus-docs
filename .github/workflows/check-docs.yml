name: Docs Contract

# Two cheap invariants that nothing was checking, on every push and every PR.
#
# `verify-docs.yml` compiles the code blocks, and it is filtered to
# `content/**` — a change to `app/`, `components/` or `lib/` does not run it at
# all. Both defects these jobs catch lived in exactly those directories:
#
#   * "575x faster than ROS2" was removed from the README and from
#     `content/docs/**`, and went on being stamped onto the <title> and OG card
#     of all 152 pages from `app/[...slug]/page.tsx`, plus `app/page.tsx`,
#     `app/manifest.ts` and a bar chart in `components/BenchmarkCharts.tsx`.
#     The Rust-side `perf_claims_contract.rs` scans `content/docs/**` only, so
#     none of that was covered by anything.
#
#   * Four links in the project README pointed at documentation routes that do
#     not exist. `app/[...slug]/page.tsx` sets `dynamicParams = false`, so those
#     are hard 404s. The Rust-side `docs_contract.rs` checks the sidebar, footer
#     and breadcrumb components — not prose links, not `#fragment` targets, and
#     not the README.
#
# No filters here on purpose: a claim can be reintroduced from any file.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  contract:
    name: Links and performance claims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The README's absolute docs.horusrobotics.dev links are routes on this
      # site, and were the four that were dead. Checking them needs the repo
      # that holds the README. A failure to clone must not silently drop the
      # README from the check, so the step is not `continue-on-error`.
      - name: Clone HORUS (for README links)
        run: git clone --depth 1 https://github.com/softmata/horus.git ../horus

      - name: Every internal link resolves
        run: node scripts/check-links.mjs ../horus/README.md

      - name: No retracted performance claim
        run: node scripts/check-claims.mjs

      # Not a check on the documentation — a check on the checks. It fails when a
      # class of claim is neither enforced by a named check nor explained as
      # needing a reader, which is the blind spot that let 155 findings survive
      # ~190 green tests. HORUS is cloned above, so the Rust-side contract files
      # it references are on disk.
      - name: Every class of claim is classified
        run: HORUS_DIR=../horus node scripts/check-parity-coverage.mjs --verbose
