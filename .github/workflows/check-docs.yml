name: Docs Contract

# Two cheap invariants that nothing was checking, on every push and every PR.
#
# `verify-docs.yml` compiles the code blocks, and it is filtered to
# `content/**` — a change to `app/`, `components/` or `lib/` does not run it at
# all. Both defects these jobs catch lived in exactly those directories:
#
#   * "575x faster than ROS2" was removed from the README and from
#     `content/docs/**`, and went on being stamped onto the <title> and OG card
#     of all 152 pages from `app/[...slug]/page.tsx`, plus `app/page.tsx`,
#     `app/manifest.ts` and a bar chart in `components/BenchmarkCharts.tsx`.
#     The Rust-side `perf_claims_contract.rs` scans `content/docs/**` only, so
#     none of that was covered by anything.
#
#   * Four links in the project README pointed at documentation routes that do
#     not exist. `app/[...slug]/page.tsx` sets `dynamicParams = false`, so those
#     are hard 404s. The Rust-side `docs_contract.rs` checks the sidebar, footer
#     and breadcrumb components — not prose links, not `#fragment` targets, and
#     not the README.
#
# No filters here on purpose: a claim can be reintroduced from any file.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  contract:
    name: Links and performance claims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The three checks above need nothing but Node. `check-mdx-props.mjs` runs
      # the site's own MDX compile, so it needs the site's dependencies.
      - name: Install dependencies
        run: npm ci

      # The README's absolute docs.horusrobotics.dev links are routes on this
      # site, and were the four that were dead. Checking them needs the repo
      # that holds the README. A failure to clone must not silently drop the
      # README from the check, so the step is not `continue-on-error`.
      - name: Clone HORUS (for README links)
        run: git clone --depth 1 https://github.com/softmata/horus.git ../horus

      - name: Every internal link resolves
        run: node scripts/check-links.mjs ../horus/README.md

      - name: No retracted performance claim
        run: node scripts/check-claims.mjs

      # Not a check on the documentation — a check on the checks. It fails when a
      # class of claim is neither enforced by a named check nor explained as
      # needing a reader, which is the blind spot that let 155 findings survive
      # ~190 green tests. HORUS is cloned above, so the Rust-side contract files
      # it references are on disk.
      - name: Every class of claim is classified
        run: HORUS_DIR=../horus node scripts/check-parity-coverage.mjs --verbose

      # next-mdx-remote 6 strips every `{...}` from MDX by default, which quietly
      # removed the `chart` prop from all 17 diagrams on the site and left them
      # on "Loading diagram..." forever. The pages still returned 200 and still
      # contained the <figure>, so nothing here noticed for as long as it shipped.
      # This step compiles the content the way the site does and fails if an
      # expression an author wrote is not in the output.
      - name: Every MDX expression survives compilation
        run: npm run check:mdx

      # Two app routes that can match one URL make Next pick one per request. The
      # site had four page routes and `/concepts/architecture` resolved as
      # locale="concepts", which 404'd every English page in `next dev` while the
      # prerendered production build looked fine. Needs no server to see.
      - name: No two app routes match the same URL
        run: npm run check:routes

      # A diagram can render a perfectly valid SVG and still be wrong on the
      # screen, which the browser job below cannot see: it asserts an <svg>
      # appeared, not that anyone can read it. Mermaid escapes HTML in subgraph
      # titles (but not in node labels), so a <small> there drew its own tags as
      # visible text; and a hardcoded `style N fill:...,color:...` opts a node
      # out of the site theme and so out of its contrast, which put white labels
      # on fills measuring 2.15:1 and 2.54:1. Pure text analysis, no browser.
      - name: Every diagram is legible, not just valid
        run: npm run check:diagrams

  # A separate job because it is the only one that needs a browser and a build.
  #
  # Everything above reads source or served HTML. None of it opens a page, and
  # that is precisely the gap that let all 17 mermaid diagrams render nothing
  # while ~190 checks stayed green: the pages returned 200, the HTML carried the
  # <figure> and the caption, and the chart prop had been deleted at compile
  # time. Its first run also found three hydration mismatches and six code
  # blocks missing their Copy button.
  rendered:
    name: Pages render in a browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: npm run build

      - name: Every page renders what its source says
        run: npm run check:rendered
