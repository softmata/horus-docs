name: indexnow

# IndexNow submitter (Bing AEO/GEO lever). When docs are merged to main, ping IndexNow so Bing indexes
# them in minutes — which means ChatGPT search / Copilot / DuckDuckGo (all Bing-backed) pick up the HORUS
# docs fast. Keyless beyond the hosted public/<key>.txt file. Docs have live traffic, so this is the
# highest-value place for instant indexing.

on:
  push:
    branches: [main]
    paths: ['content/docs/**', 'content/i18n/**']

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD~1 to diff changed docs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit changed docs to IndexNow
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'content/docs/**/*.mdx' 'content/i18n/**/*.mdx' | tr '\n' ' ')
          if [ -n "$CHANGED" ]; then
            echo "Changed docs: $CHANGED"
            node scripts/indexnow.mjs --files $CHANGED
          else
            echo "No doc changes to submit."
          fi
