name: Verify Documentation Code

on:
  push:
    branches: [main, dev]
    paths:
      - 'content/**/*.mdx'
      - 'content/**/*.md'
      - 'scripts/extract-code-blocks.mjs'
      - 'scripts/verify-*.mjs'
      - 'docker/**'
      - '.github/workflows/verify-docs.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'content/**/*.mdx'
      - 'content/**/*.md'
      - 'scripts/extract-code-blocks.mjs'
      - 'scripts/verify-*.mjs'
      - 'docker/**'
      - '.github/workflows/verify-docs.yml'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter blocks by ID pattern (regex)'
        required: false
        type: string
      rust_only:
        description: 'Only verify Rust blocks'
        required: false
        type: boolean
        default: false
      python_only:
        description: 'Only verify Python blocks'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  extract-blocks:
    name: Extract Code Blocks
    runs-on: ubuntu-latest
    outputs:
      rust-count: ${{ steps.count.outputs.rust }}
      python-count: ${{ steps.count.outputs.python }}
      total-count: ${{ steps.count.outputs.total }}
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract code blocks
        run: npm run extract:code

      - name: Count blocks
        id: count
        run: |
          RUST=$(jq '[.blocks[] | select(.language == "rust" and .verifiable)] | length' extracted-code-blocks.json)
          PYTHON=$(jq '[.blocks[] | select(.language == "python" and .verifiable)] | length' extracted-code-blocks.json)
          TOTAL=$(jq '.totalBlocks' extracted-code-blocks.json)
          echo "rust=$RUST" >> $GITHUB_OUTPUT
          echo "python=$PYTHON" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "📊 Found $TOTAL code blocks ($RUST Rust, $PYTHON Python verifiable)"

      - name: Upload extracted blocks
        uses: actions/upload-artifact@v4
        with:
          name: extracted-code-blocks
          path: extracted-code-blocks.json
          retention-days: 1

  verify-rust:
    name: Verify Rust Blocks
    needs: extract-blocks
    if: needs.extract-blocks.outputs.rust-count > 0 && !inputs.python_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Download extracted blocks
        uses: actions/download-artifact@v4
        with:
          name: extracted-code-blocks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # HORUS is checked out INSIDE the workspace, not as a sibling (../horus).
      # hashFiles() in the cache key below is evaluated by the Actions runner and is
      # rooted at GITHUB_WORKSPACE: any pattern that escapes the workspace fails the
      # whole job with "Fail to hash files under directory <workspace>" before a
      # single step of it runs. So the checkout, the cache key and the --horus-path
      # argument all use the workspace-relative `horus/` directory.
      - name: Checkout HORUS
        uses: actions/checkout@v4
        with:
          repository: softmata/horus
          path: horus
          fetch-depth: 1

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            horus/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('horus/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Pre-build HORUS dependencies
        working-directory: horus
        run: cargo check --release || true

      - name: Verify Rust code blocks
        id: verify
        run: |
          ARGS="--horus-path horus"
          if [ -n "${{ inputs.filter }}" ]; then
            ARGS="$ARGS --filter ${{ inputs.filter }}"
          fi
          node scripts/verify-rust-local.mjs $ARGS --verbose 2>&1 | tee rust-verification.log
        continue-on-error: true

      - name: Upload Rust results
        uses: actions/upload-artifact@v4
        with:
          name: rust-verification-log
          path: rust-verification.log
          retention-days: 7

      - name: Check Rust verification status
        if: steps.verify.outcome == 'failure'
        run: |
          echo "❌ Rust verification failed"
          exit 1

  verify-python:
    name: Verify Python Blocks
    needs: extract-blocks
    if: needs.extract-blocks.outputs.python-count > 0 && !inputs.rust_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Download extracted blocks
        uses: actions/download-artifact@v4
        with:
          name: extracted-code-blocks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust (for maturin)
        uses: dtolnay/rust-toolchain@stable

      # Two separate acquisitions of HORUS on purpose. The maturin build below
      # is allowed to fail — a wheel that will not build must not take the
      # syntax check down with it — but the API check needs the source tree to
      # be there unconditionally, so it gets its own checkout that is not
      # continue-on-error.
      - name: Checkout HORUS
        uses: actions/checkout@v4
        with:
          repository: softmata/horus
          path: horus
          fetch-depth: 1

      - name: Install maturin and build horus-robotics
        run: |
          pip install maturin
          cd horus/horus_py
          maturin build --release
          pip install target/wheels/*.whl
        continue-on-error: true

      - name: Verify Python code blocks
        id: verify
        run: |
          ARGS=""
          if [ -n "${{ inputs.filter }}" ]; then
            ARGS="$ARGS --filter ${{ inputs.filter }}"
          fi
          node scripts/verify-python-local.mjs $ARGS --verbose 2>&1 | tee python-verification.log

      # The step above is `py_compile`: it proves a block is valid Python and
      # nothing more. `horus.Tensr()`, `Node(freq=100)` and an import of a name
      # that was never exported all pass it. This one reads the real surface out
      # of horus_py and walks each block's AST against it, and unlike the step
      # above it needs no built wheel — only the source tree checked out below.
      - name: Verify Python API usage
        id: verify_api
        run: python3 scripts/verify_python_api.py --horus-path horus --verbose 2>&1 | tee -a python-verification.log
        continue-on-error: true

      - name: Upload Python results
        uses: actions/upload-artifact@v4
        with:
          name: python-verification-log
          path: python-verification.log
          retention-days: 7

      - name: Check Python verification status
        if: steps.verify.outcome == 'failure' || steps.verify_api.outcome == 'failure'
        run: |
          echo "❌ Python verification failed"
          exit 1

  verify-cpp:
    name: Verify C++ Blocks
    needs: extract-blocks
    if: ${{ !inputs.rust_only && !inputs.python_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Download extracted blocks
        uses: actions/download-artifact@v4
        with:
          name: extracted-code-blocks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The C++ job needs headers and a compiler, and nothing else: the samples
      # are checked with -fsyntax-only, so there is no cargo build, no cxx
      # codegen and no link step. That is why this job is minutes cheaper than
      # verify-rust while covering the binding with the least margin for error —
      # horus_cpp is a hand-written mirror of the Rust core, so a renamed field
      # shows up in the docs and nowhere else.
      - name: Checkout HORUS
        uses: actions/checkout@v4
        with:
          repository: softmata/horus
          path: horus
          fetch-depth: 1

      - name: Verify C++ code blocks
        id: verify
        run: node scripts/verify-cpp-local.mjs --horus-path horus --verbose 2>&1 | tee cpp-verification.log
        continue-on-error: true

      - name: Upload C++ results
        uses: actions/upload-artifact@v4
        with:
          name: cpp-verification-log
          path: cpp-verification.log
          retention-days: 7

      - name: Check C++ verification status
        if: steps.verify.outcome == 'failure'
        run: |
          echo "❌ C++ verification failed"
          exit 1

  report:
    name: Generate Report
    needs: [extract-blocks, verify-rust, verify-python, verify-cpp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          echo "# Documentation Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Code Blocks" >> $GITHUB_STEP_SUMMARY
          echo "- **Total blocks**: ${{ needs.extract-blocks.outputs.total-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Verifiable Rust**: ${{ needs.extract-blocks.outputs.rust-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Verifiable Python**: ${{ needs.extract-blocks.outputs.python-count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Rust status
          if [ "${{ needs.verify-rust.result }}" == "success" ]; then
            echo "## ✅ Rust Verification: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.verify-rust.result }}" == "failure" ]; then
            echo "## ❌ Rust Verification: FAILED" >> $GITHUB_STEP_SUMMARY
            if [ -f artifacts/rust-verification-log/rust-verification.log ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Show failures</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -A 5 "FAIL" artifacts/rust-verification-log/rust-verification.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.verify-rust.result }}" == "skipped" ]; then
            echo "## ⏭️ Rust Verification: SKIPPED" >> $GITHUB_STEP_SUMMARY
          fi

          # Python status
          if [ "${{ needs.verify-python.result }}" == "success" ]; then
            echo "## ✅ Python Verification: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.verify-python.result }}" == "failure" ]; then
            echo "## ❌ Python Verification: FAILED" >> $GITHUB_STEP_SUMMARY
            if [ -f artifacts/python-verification-log/python-verification.log ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Show failures</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -A 5 "FAIL" artifacts/python-verification-log/python-verification.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.verify-python.result }}" == "skipped" ]; then
            echo "## ⏭️ Python Verification: SKIPPED" >> $GITHUB_STEP_SUMMARY
          fi

          # C++ status
          if [ "${{ needs.verify-cpp.result }}" == "success" ]; then
            echo "## ✅ C++ Verification: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.verify-cpp.result }}" == "failure" ]; then
            echo "## ❌ C++ Verification: FAILED" >> $GITHUB_STEP_SUMMARY
            if [ -f artifacts/cpp-verification-log/cpp-verification.log ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Show failures</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -A 5 "FAIL" artifacts/cpp-verification-log/cpp-verification.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.verify-cpp.result }}" == "skipped" ]; then
            echo "## ⏭️ C++ Verification: SKIPPED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && (needs.verify-rust.result == 'failure' || needs.verify-python.result == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## ❌ Documentation Code Verification Failed\n\n';
            body += 'Some code blocks in the documentation failed to compile or execute.\n\n';

            const rustResult = '${{ needs.verify-rust.result }}';
            const pythonResult = '${{ needs.verify-python.result }}';

            if (rustResult === 'failure') {
              body += '### Rust Failures\n';
              try {
                const log = fs.readFileSync('artifacts/rust-verification-log/rust-verification.log', 'utf8');
                const failures = log.match(/Failed blocks:[\s\S]*?(?=\n\n|$)/);
                if (failures) {
                  body += '```\n' + failures[0] + '\n```\n\n';
                }
              } catch (e) {
                body += 'See workflow logs for details.\n\n';
              }
            }

            if (pythonResult === 'failure') {
              body += '### Python Failures\n';
              try {
                const log = fs.readFileSync('artifacts/python-verification-log/python-verification.log', 'utf8');
                const failures = log.match(/Failed blocks:[\s\S]*?(?=\n\n|$)/);
                if (failures) {
                  body += '```\n' + failures[0] + '\n```\n\n';
                }
              } catch (e) {
                body += 'See workflow logs for details.\n\n';
              }
            }

            body += '---\n';
            body += '*Generated by [Documentation Verification](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  final-status:
    name: Final Status
    needs: [verify-rust, verify-python, verify-cpp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check overall status
        run: |
          RUST_RESULT="${{ needs.verify-rust.result }}"
          PYTHON_RESULT="${{ needs.verify-python.result }}"
          CPP_RESULT="${{ needs.verify-cpp.result }}"

          if [ "$RUST_RESULT" == "failure" ] || [ "$PYTHON_RESULT" == "failure" ] || [ "$CPP_RESULT" == "failure" ]; then
            echo "❌ Documentation verification failed"
            exit 1
          fi

          echo "✅ Documentation verification passed"
