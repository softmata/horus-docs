<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Execution class selection from the Rust node builder</title>
  <desc id="desc">A node builder selects BestEffort by default, Rt for timing constraints, Compute for compute, Event for topic events, AsyncIo for asynchronous I/O, and Gpu for GPU work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .label { fill: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 650; }
      .small { fill: #d1d5db; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
      .edge { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .edge-label { fill: #cbd5e1; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    </style>
  </defs>
  <rect width="820" height="470" fill="#111827" rx="12"/>

  <rect x="320" y="28" width="180" height="62" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="410" y="65" text-anchor="middle" class="label">Node Builder</text>

  <g>
    <rect x="40" y="160" width="190" height="74" rx="10" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
    <text x="135" y="191" text-anchor="middle" class="label">BestEffort</text>
    <text x="135" y="214" text-anchor="middle" class="small">Main loop, sequential</text>
  </g>
  <g>
    <rect x="315" y="160" width="190" height="74" rx="10" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <text x="410" y="191" text-anchor="middle" class="label">Rt</text>
    <text x="410" y="214" text-anchor="middle" class="small">Dedicated thread</text>
  </g>
  <g>
    <rect x="590" y="160" width="190" height="74" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
    <text x="685" y="191" text-anchor="middle" class="label">Compute</text>
    <text x="685" y="214" text-anchor="middle" class="small">Thread pool, parallel</text>
  </g>
  <g>
    <rect x="40" y="340" width="190" height="74" rx="10" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <text x="135" y="371" text-anchor="middle" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Event</text>
    <text x="135" y="394" text-anchor="middle" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Sleeps until message</text>
  </g>
  <g>
    <rect x="315" y="340" width="190" height="74" rx="10" fill="#a855f7" stroke="#9333ea" stroke-width="2"/>
    <text x="410" y="371" text-anchor="middle" class="label">AsyncIo</text>
    <text x="410" y="394" text-anchor="middle" class="small">Tokio runtime</text>
  </g>
  <g>
    <rect x="590" y="340" width="190" height="74" rx="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <text x="685" y="371" text-anchor="middle" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Gpu</text>
    <text x="685" y="394" text-anchor="middle" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">CUDA stream</text>
  </g>

  <path class="edge" d="M 365 90 C 260 118, 185 130, 138 160"/>
  <text x="105" y="128" class="edge-label">default</text>
  <path class="edge" d="M 410 90 L 410 160"/>
  <text x="425" y="128" class="edge-label">.rate() / .budget() / .deadline()</text>
  <path class="edge" d="M 455 90 C 560 118, 635 130, 682 160"/>
  <text x="610" y="128" class="edge-label">.compute()</text>
  <path class="edge" d="M 355 90 C 205 165, 130 235, 135 340"/>
  <text x="120" y="288" class="edge-label">.on(topic)</text>
  <path class="edge" d="M 410 90 C 410 170, 410 250, 410 340"/>
  <text x="425" y="287" class="edge-label">.async_io()</text>
  <path class="edge" d="M 465 90 C 615 165, 690 235, 685 340"/>
  <text x="675" y="288" class="edge-label">.gpu()</text>
</svg>
