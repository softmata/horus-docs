<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-labelledby="title desc">
  <title id="title">Hardware driver data flow</title>
  <desc id="desc">horus.toml creates NodeParams for a MotorDriver node, which communicates with hardware, subscribes to joint commands, and publishes joint state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill: #1f2937; stroke: #64748b; stroke-width: 2; }
      .node { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; }
      .hardware { fill: #f59e0b; stroke: #d97706; stroke-width: 2; }
      .topic { fill: #16a34a; stroke: #15803d; stroke-width: 2; }
      .text { fill: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; }
      .dark { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; }
      .edge { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .link { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
      .edge-label { fill: #cbd5e1; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    </style>
  </defs>
  <rect width="820" height="270" fill="#111827" rx="12"/>

  <rect x="40" y="48" width="138" height="62" rx="10" class="box"/>
  <text x="109" y="85" text-anchor="middle" class="text">horus.toml</text>

  <rect x="238" y="48" width="138" height="62" rx="10" class="box"/>
  <text x="307" y="85" text-anchor="middle" class="text">NodeParams</text>

  <rect x="438" y="100" width="158" height="72" rx="10" class="node"/>
  <text x="517" y="132" text-anchor="middle" class="text">MotorDriver</text>
  <text x="517" y="154" text-anchor="middle" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Node</text>

  <rect x="238" y="172" width="138" height="62" rx="10" class="hardware"/>
  <text x="307" y="209" text-anchor="middle" class="dark">Hardware</text>

  <rect x="650" y="48" width="130" height="62" rx="10" class="topic"/>
  <text x="715" y="85" text-anchor="middle" class="text">joint_state</text>

  <rect x="650" y="172" width="130" height="62" rx="10" class="topic"/>
  <text x="715" y="209" text-anchor="middle" class="text">joint_cmd</text>

  <path class="edge" d="M 178 79 L 238 79"/>
  <path class="edge" d="M 376 79 C 414 79, 430 97, 438 117"/>
  <path class="link" d="M 376 203 C 414 203, 430 175, 438 154"/>
  <path class="edge" d="M 596 120 C 620 106, 632 86, 650 79"/>
  <text x="620" y="99" class="edge-label">publish</text>
  <path class="edge" d="M 650 203 C 628 197, 613 173, 596 153"/>
  <text x="618" y="193" class="edge-label">subscribe</text>
</svg>
