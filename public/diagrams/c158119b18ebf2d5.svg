<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" role="img" aria-labelledby="title desc">
  <title id="title">One scheduler tick cycle</title>
  <desc id="desc">A sensor node publishes scan data, a control node consumes the scan, and a logger node consumes the command before the next tick starts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; }
      .small { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
      .edge { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .edge-label { fill: #cbd5e1; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    </style>
  </defs>
  <rect width="780" height="260" fill="#111827" rx="12"/>
  <rect x="28" y="32" width="724" height="168" rx="14" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="390" y="60" text-anchor="middle" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">One Tick Cycle</text>

  <g>
    <rect x="70" y="95" width="170" height="72" rx="10" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <text x="155" y="124" text-anchor="middle" fill="#111827" class="label">SensorNode</text>
    <text x="155" y="148" text-anchor="middle" fill="#111827" class="small">publishes scan</text>
  </g>
  <g>
    <rect x="305" y="95" width="170" height="72" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
    <text x="390" y="124" text-anchor="middle" fill="#f8fafc" class="label">ControlNode</text>
    <text x="390" y="148" text-anchor="middle" fill="#d1d5db" class="small">subscribes scan</text>
  </g>
  <g>
    <rect x="540" y="95" width="170" height="72" rx="10" fill="#a855f7" stroke="#9333ea" stroke-width="2"/>
    <text x="625" y="124" text-anchor="middle" fill="#f8fafc" class="label">LoggerNode</text>
    <text x="625" y="148" text-anchor="middle" fill="#d1d5db" class="small">subscribes cmd</text>
  </g>

  <path class="edge" d="M 240 131 L 305 131"/>
  <path class="edge" d="M 475 131 L 540 131"/>
  <path class="dash" d="M 625 167 C 610 225, 170 225, 155 167"/>
  <text x="376" y="231" text-anchor="middle" class="edge-label">next tick</text>
</svg>
